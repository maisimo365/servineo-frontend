<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Solicitudes - Fixers</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>📩 Sistema de Gestión de Solicitudes</h1>
    
    <div class="form-section">
      <h2>Datos del Requester</h2>
      <label>Región:</label>
      <input id="region" value="591" placeholder="Código de región" />

      <label>Número:</label>
      <input id="numero" value="69542509" placeholder="Número de teléfono" />

      <label>Nombre del Cliente:</label>
      <input id="nombreRequester" value="Juan Pérez" placeholder="Nombre completo" />

      <label>Zona/Ciudad:</label>
      <input id="zona" value="La Paz" placeholder="Zona o ciudad" />
    </div>

    <div class="form-section">
      <h2>Datos del Servicio</h2>
      <label>Tipo de Servicio:</label>
      <input id="servicio" value="Reparación de laptop" placeholder="Tipo de servicio" />

      <label>Descripción del Servicio:</label>
      <textarea id="mensajeUsuario" placeholder="Describe detalladamente lo que necesitas...">Necesito reparar la pantalla de mi laptop Dell que se rompió ayer cuando se cayó de la mesa</textarea>

      <label>Fixer Específico (opcional):</label>
      <input id="nombreFixer" value="" placeholder="Dejar vacío para asignación automática" />

      <label>¿El fixer trabaja sábados?</label>
      <select id="trabajaSabado">
        <option value="false">No</option>
        <option value="true">Sí</option>
      </select>
    </div>

    <div class="info-section">
      <h3>Información Generada</h3>
      <div class="info-row">
        <span><strong>Código Único:</strong></span>
        <span id="codigoUnico">-</span>
      </div>
      <div class="info-row">
        <span><strong>Estado:</strong></span>
        <span id="estadoSolicitud">-</span>
      </div>
      <div class="info-row">
        <span><strong>Fecha Registro:</strong></span>
        <span id="fechaRegistro">-</span>
      </div>
      <div class="info-row">
        <span><strong>Fecha Estimada Respuesta:</strong></span>
        <span id="fechaEstimada">-</span>
      </div>
    </div>

    <button id="enviarBtn">Registrar Solicitud</button>

    <div id="mensajesSistema" class="mensaje-sistema"></div>

    <div class="debug-section">
      <h3>🧾 JSON Enviado:</h3>
      <pre id="salidaJson"></pre>

      <h3>📡 Respuesta del servidor:</h3>
      <pre id="respuestaServidor"></pre>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
